name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  node-lint-build-test:
    name: Node.js Typecheck, Test & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run Integration Tests
        run: npx tsx scripts/test-integration.ts

      - name: Run Security Tests
        run: npx tsx scripts/test-security.ts

      - name: Next.js Production Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  python-backend-test:
    name: Python Backend & Multi-Tenancy Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python-backend/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-backend/requirements.txt

      - name: Run Python Pipeline Tests
        run: python python-backend/test_pipeline.py

      - name: Run Real AI Evaluation Suite
        run: python python-backend/test_evals.py

      - name: Run Database Tests
        run: python python-backend/test_db.py

      - name: Run Massive Multi-Tenancy Tests
        run: python python-backend/test_massive_multitenancy.py
