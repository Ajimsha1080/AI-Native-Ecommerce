version: '3.8'

services:
  # 1. Enterprise PostgreSQL 16 with pgvector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aaas-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aaas_enterprise}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Distributed Cache & Task Queue
  redis:
    image: redis:7-alpine
    container_name: aaas-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Python FastAPI Enterprise AI & RAG Backend
  python-backend:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: aaas-python-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-aaas_enterprise}
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Next.js 15 Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aaas-frontend
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-aaas_enterprise}
      PYTHON_BACKEND_URL: http://python-backend:8000
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - python-backend

volumes:
  postgres_data:
  redis_data:
